# Vikunja 配置文件

service:
  # 服务监听地址和端口
  # interface: 0.0.0.0:80
  # 公开 URL（可选，用于 CORS 和 邮件）
  # publicurl: http://your-domain.com
  JWTSecret: "your-secret-here"
  rootpath: ./

cors:
  # 禁用 CORS（本地单机部署）
  enable: false

auth:
  login2:
    # Login2 接口的授权key，留空则禁用该接口
    # key: ""

database:
  # 数据库类型
  type: sqlite
  # SQLite 数据库文件路径（相对路径）
  # path: ./vikunja.db

# AI 助手配置
ai:
  # LLM 提供商：mock, openai, ollama
  llm_provider: openai
  # OpenAI 配置
  openai:
    # API 密钥
    # key: "your-openai-api-key"
    # 模型名称（如：gpt-4o-mini, gpt-4o）
    # model: "gpt-4o"
    # API 基础 URL（可选，默认：https://api.openai.com/v1）
    # base_url: "https://api.openai.com/v1"
  # Ollama 配置
  ollama:
    # 基础 URL（默认：http://localhost:11434）
    # base_url: http://localhost:11434
    # 模型名称（如：llama2, mistral）
    # model: llama2
  # Agent 行为配置
  max_iterations: 10
  # LLM 日志记录（可选，默认：false）
  # 启用后将在 llm_log_path 目录下保存每次请求和响应
  llm_log: false
  # LLM 日志保存路径（可选，默认：llmlog）
  # llm_log_path: llmlog
  # LLM 日志简略模式（可选，默认：false）
  # 启用后保存请求时将不包含 tools 部分
  # llm_log_brief_mode: false
  temperature: 0.7
  # 启用的技能列表（空表示启用所有）
  enabled_skills: []
  # 启用的工具列表（空表示启用所有）
  enabled_tools: []
  # 自定义系统提示词（可选）
  # system_prompt: "your system prompt"
